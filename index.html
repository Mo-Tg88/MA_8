<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جدول سكشن 12</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a8a">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#111827;--muted:#64748b;--line:#dbe2ee;--pri:#1e3a8a;--priText:#fff;
--inBg:#ecfdf5;--inBd:#22c55e;--inTx:#15803d;--onBg:#eff6ff;--onBd:#3b82f6;--onTx:#1d4ed8;--chip:#e2e8f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#111a2e;--text:#e5e7eb;--muted:#94a3b8;--line:#243049;--pri:#3b5bdb;--priText:#fff;--inBg:#0f2a1f;--inTx:#4ade80;--onBg:#0f1f3d;--onTx:#93c5fd;--chip:#1e293b}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#111a2e;--text:#e5e7eb;--muted:#94a3b8;--line:#243049;--pri:#3b5bdb;--priText:#fff;--inBg:#0f2a1f;--inTx:#4ade80;--onBg:#0f1f3d;--onTx:#93c5fd;--chip:#1e293b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.lbl{font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
.seg{display:flex;gap:8px}
.seg button,.days button,.today{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px}
.seg button{flex:1;padding:11px 8px;font-size:15px;font-weight:700}
.seg button.on{background:var(--pri);color:var(--priText);border-color:var(--pri)}
.badge{display:inline-block;font-size:11px;background:#f59e0b;color:#1f2937;border-radius:8px;padding:1px 7px;margin-inline-start:6px;vertical-align:middle}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.days button{padding:10px 4px;font-size:15px;font-weight:600;position:relative}
.days button.on{background:var(--pri);color:var(--priText);border-color:var(--pri)}
.days button.td::after{content:"";position:absolute;top:6px;inset-inline-end:8px;width:8px;height:8px;border-radius:50%;background:#f59e0b}
.head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.head h2{font-size:22px;margin:0}
.cnt{font-size:12px;color:var(--muted)}
.card{display:flex;border-radius:14px;margin-bottom:10px;overflow:hidden;border-inline-start:7px solid}
.card.i{background:var(--inBg);border-color:var(--inBd)}
.card.o{background:var(--onBg);border-color:var(--onBd)}
.tm{width:40%;padding:12px 10px;border-inline-end:1px solid var(--line);flex:none}
.t1{font-weight:700;font-size:15px;white-space:nowrap}
.t2{font-size:13px;color:var(--muted);margin-top:2px}
.bd{padding:12px 12px;flex:1}
.tg{font-size:12px;font-weight:700}
.i .tg{color:var(--inTx)}.o .tg{color:var(--onTx)}
.sj{font-size:16px;font-weight:700;margin-top:1px}
.dt{font-size:13px;color:var(--muted);margin-top:3px}
.off{text-align:center;padding:36px 10px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:18px}
.today{width:100%;margin-top:8px;padding:10px;font-weight:600;font-size:14px}
.note{font-size:12.5px;color:var(--muted);margin-top:6px}
.set{margin-top:22px;padding-top:6px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <h1>جدول سكشن 12</h1>
  <div class="sub">الفرقة الأولى · مجموعة 1-2 · الترم الأول</div>

  <div class="lbl">اختار الأسبوع</div>
  <div class="seg" id="weeks"></div>

  <div class="lbl">اختار اليوم</div>
  <div class="days" id="days"></div>
  <button class="today" id="goToday">⟲ ارجع لليوم</button>
  <div class="note" id="fri"></div>

  <div class="head"><h2 id="dayTitle"></h2><span class="cnt" id="cnt"></span></div>
  <div id="list"></div>

  <div class="set">
    <div class="lbl">أنا حاليًا في أنهي أسبوع؟</div>
    <div class="seg" id="setWeek"></div>
    <div class="note">الأسبوع بيتبدّل لوحده كل سبت، فاختار مرة واحدة بس.</div>
  </div>
</div>

<script>
const DAYS=["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];
const T={1:["فترة 1","8:30 – 10:10 ص"],2:["فترة 2","10:20 ص – 12:00 م"],3:["فترة 3","12:20 – 2:00 م"],4:["فترة 4","2:10 – 3:50 م"],5:["فترة 5","4:00 – 5:40 م"],6:["فترة 6","5:50 – 7:30 م"],o1:["أونلاين 1","7:30 – 9:00 م"],o2:["أونلاين 2","9:00 – 10:30 م"]};
const PROG="مقدمة للبرمجة وحل المشكلات",MC="رياضيات تكميلية (علمي علوم)",COM="مهارات الاتصال والجوانب الأخلاقية والمهنية",ELE="أساسيات الإلكترونيات والدوائر الكهربية",INT="مقدمة الحاسبات والمعلوماتية",M1="رياضيات 1 لعلوم الحاسب",ENG="لغة إنجليزية لعلوم الحاسب";
const dELE="أ.م.د/ نهال صقر، د/ نيرة العزب",dMC="أ.د/ شريف بركات",dM1="أ.د/ سمير الموجي، أ.م.د/ رشا صقر، د/ عمرو الأدكاوي",dPROG="أ.د/ محمد أبو السعود، د/ محمد حجاج",dINT="د/ أمل أبو العينين، د/ نجوى العربي، د/ هالة عكاشة",dENG="د/ هبة قنديل، د/ ياسمين الصقار",dCOM="أ.د/ حازم البكري، د/ شاهنده الخولي";
// [slot, kind s=سكشن l=محاضرة, mode i=حضوري o=أونلاين, subject, details]
const W={
1:[
 [[1,'s','i',PROG,"A4 · زياد عبدالفتاح"],[2,'s','i',MC,"قاعة 1 · محمد العطوي"],[4,'s','i',COM,"قاعة 6 · منة الله أحمد"]],
 [],
 [[4,'s','i',ELE,"قاعة 3 (Hardware) · ندى محمد"],[5,'s','i',INT,"C6 · محمد سلامة"],["o1",'l','o',ELE,dELE],["o2",'l','o',MC,dMC]],
 [["o1",'l','o',M1,dM1],["o2",'l','o',PROG,dPROG]],
 [["o2",'l','o',INT,dINT]],
 [[1,'s','i',M1,"قاعة 3 (Hardware) · أميرة سامي"],[2,'s','i',ENG,"قاعة 1 · خلود عامر"],["o1",'l','o',COM,dCOM],["o2",'l','o',ENG,dENG]]
],
2:[
 [],
 [["o1",'s','o',COM,"منة الله أحمد"],["o2",'s','o',ELE,"ندى محمد"]],
 [[1,'l','i',MC,dMC+" · مدرج 1"],[3,'l','i',ELE,dELE+" · مدرج 2"],["o1",'s','o',PROG,"زياد عبدالفتاح"],["o2",'s','o',MC,"محمد العطوي"]],
 [[3,'l','i',COM,dCOM+" · مدرج 2"],[4,'l','i',M1,dM1+" · مدرج 1"],["o1",'s','o',M1,"أميرة سامي"]],
 [[2,'l','i',INT,dINT+" · مدرج 1"],["o2",'s','o',INT,"محمد سلامة"]],
 [[3,'l','i',PROG,dPROG+" · مدرج 1"],[4,'l','i',ENG,dENG+" · مدرج 3"],["o2",'s','o',ENG,"خلود عامر"]]
]};

const $=s=>document.querySelector(s);
const startOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+1)%7));return x};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
let anchor={start:"2026-10-17",week:1};
try{const s=localStorage.getItem("anchor");if(s)anchor=JSON.parse(s)}catch(e){}

const now=new Date(),isFri=now.getDay()===5;
const ref=new Date(now.getFullYear(),now.getMonth(),now.getDate()+(isFri?1:0));
const todayIdx=isFri?0:(now.getDay()+1)%7;
const curWeek=()=>{const n=Math.round((startOf(ref)-parse(anchor.start))/6048e5);return((n%2)+2)%2===0?anchor.week:3-anchor.week};

let wk=curWeek(),dy=todayIdx;

function render(){
  const cw=curWeek();
  $("#weeks").innerHTML=[1,2].map(n=>`<button class="${n===wk?"on":""}" data-w="${n}">الأسبوع ${n}${n===cw?'<span class="badge">الحالي</span>':""}</button>`).join("");
  $("#setWeek").innerHTML=[1,2].map(n=>`<button class="${n===cw?"on":""}" data-s="${n}">أسبوع ${n}</button>`).join("");
  $("#days").innerHTML=DAYS.map((d,i)=>`<button class="${i===dy?"on":""} ${(i===todayIdx&&wk===cw)?"td":""}" data-d="${i}">${d}</button>`).join("");
  $("#fri").textContent=isFri?"النهارده الجمعة، فبعرض لك السبت الجاي.":"";
  const items=W[wk][dy];
  $("#dayTitle").textContent=DAYS[dy];
  const inN=items.filter(x=>x[2]==="i").length,onN=items.length-inN;
  $("#cnt").textContent=items.length?`${inN} حضوري · ${onN} أونلاين`:"";
  $("#list").innerHTML=items.length?items.map(([sl,k,m,sj,dt])=>{
    const [nm,tm]=T[sl];
    return `<div class="card ${m}"><div class="tm"><div class="t1" dir="ltr" style="text-align:right">${tm}</div><div class="t2">${nm}</div></div><div class="bd"><div class="tg">${k==="s"?"سكشن":"محاضرة"} · ${m==="i"?"حضوري":"أونلاين"}</div><div class="sj">${sj}</div><div class="dt">${dt}</div></div></div>`;
  }).join(""):`<div class="off">إجازة 🌴<br><small>مفيش حاجة النهارده</small></div>`;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.w){wk=+b.dataset.w}
  else if(b.dataset.d){dy=+b.dataset.d}
  else if(b.dataset.s){anchor={start:iso(startOf(ref)),week:+b.dataset.s};try{localStorage.setItem("anchor",JSON.stringify(anchor))}catch(e){}wk=curWeek();dy=todayIdx}
  else if(b.id==="goToday"){wk=curWeek();dy=todayIdx}
  render();
});
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
